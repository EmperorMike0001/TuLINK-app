{% extends 'base.html' %}
{% block content %}
    <h1>Events</h1>
    <ul class="list-group">
        {% for event in events %}
            <li class="list-group-item">
                <h5>{{ event.title }}</h5>
                <p>{{ event.description }}</p>
                <p>Location: {{ event.location }}</p>
                <a href="{% url 'event_create' %}" class="btn btn-primary">Create Event</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
